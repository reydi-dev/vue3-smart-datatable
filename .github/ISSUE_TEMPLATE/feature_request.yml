name: Feature request
description: Describe a use case and the behavior you need.
title: 'feature: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case
      description: Describe the problem and check existing roadmap issues first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and alternatives
    validations:
      required: true
