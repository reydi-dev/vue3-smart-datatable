name: Bug report
description: Report a reproducible problem with the available implementation.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 'This project is in development. Check the roadmap for features that are not implemented yet. Never include secrets or private data.'
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Include Vue version and relevant browser/Node version.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Share a small public repository, playground link, or exact steps with synthetic data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
